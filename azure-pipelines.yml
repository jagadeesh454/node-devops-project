# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: npm install
  displayName: 'Install Dependencies'

- script: |
    echo "Build step completed"
  displayName: 'Build Application'

- script: |
    npm test
  displayName: 'Run Unit Tests'

- script: echo "Code Coverage Completed"
  displayName: 'Code Coverage'

- script: echo "SonarQube Analysis"
  displayName: 'SonarQube'

- script: echo "Security Scan"
  displayName: 'Security Scan'

- script: |
    docker build -t node-devops-project .
  displayName: 'Docker Build'

- task: Docker@2
  displayName: 'Docker Push'
  inputs:
    command: login
    containerRegistry: 'dockerhub-connection'

- script: |
    docker tag node-devops-project jagadeesh1102/node-devops-project:$(Build.BuildId)
    docker push jagadeesh1102/node-devops-project:$(Build.BuildId)
  displayName: 'Push Image To Docker Hub'

- task: KubernetesManifest@1
  displayName: Deploy to AKS
  inputs:
    action: deploy
    kubernetesServiceConnection: aks-connection
    namespace: default
    manifests: |
      k8s/deployment.yaml
      k8s/service.yaml
    containers: |
      jagadeesh1102/node-devops-project:$(Build.BuildId)